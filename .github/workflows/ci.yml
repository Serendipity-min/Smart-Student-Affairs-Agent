name: CI Quality & Security Test Suite

on:
  push:
    branches: [ master, main, 'gemini/*', 'codex/*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    name: Build & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: contest_demo_web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. External Mock API Tests (Zero extra dependencies)
      - name: Run Node.js HTTP API Tests
        working-directory: external_mock_api
        run: |
          node --test test/*.test.mjs

      # 2. Python Fallback Server Tests
      - name: Run Python Backend Tests
        run: |
          python mock_api/test_server.py

      # 3. Gateway Syntax Check
      - name: Gateway Syntax Check
        working-directory: contest_demo_gateway
        run: |
          node --check src/server.mjs

      # 4. Web Frontend Build
      - name: Build Web Application
        working-directory: contest_demo_web
        run: |
          npm install
          npm run build
