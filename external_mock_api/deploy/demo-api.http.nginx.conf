server {
    listen 80;
    listen [::]:80;
    server_name demo-api.serendipituwpt.art;

    # 在证书尚未签发前，公网只保留 ACME 校验路径；业务接口一律不通过 HTTP 暴露。
    location ^~ /.well-known/acme-challenge/ {
        # 独立目录需允许 Nginx 工作进程读取，不能复用仅服务账户可访问的状态库目录。
        root /var/lib/acme/student-affairs-api;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
