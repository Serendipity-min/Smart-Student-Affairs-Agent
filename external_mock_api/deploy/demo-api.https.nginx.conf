server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo-api.serendipituwpt.art;

    ssl_certificate /etc/nginx/ssl/demo-api.serendipituwpt.art/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/demo-api.serendipituwpt.art/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:StudentAffairsDemoSSL:10m;

    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # OpenAPI 定义不含密钥，仅供已登录平台读取；独立静态路径避免暴露应用源码目录。
    location = /openapi.yaml {
        alias /var/www/student-affairs-demo-api/openapi.yaml;
        default_type application/yaml;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3188/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:3188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        return 404;
    }
}
